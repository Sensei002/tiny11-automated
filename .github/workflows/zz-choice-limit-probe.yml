name: zz-choice-limit-probe
# Throwaway: proves GitHub accepts a 38-option `choice` input. Deleted immediately after.
on:
  workflow_dispatch:
    inputs:
      language:
        description: 'probe'
        type: choice
        required: false
        default: 'English (United States)'
        options:
          - 'Arabic'
          - 'Brazilian Portuguese'
          - 'Bulgarian'
          - 'Chinese Simplified'
          - 'Chinese Traditional'
          - 'Croatian'
          - 'Czech'
          - 'Danish'
          - 'Dutch'
          - 'English (United States)'
          - 'English International'
          - 'Estonian'
          - 'Finnish'
          - 'French'
          - 'French Canadian'
          - 'German'
          - 'Greek'
          - 'Hebrew'
          - 'Hungarian'
          - 'Italian'
          - 'Japanese'
          - 'Korean'
          - 'Latvian'
          - 'Lithuanian'
          - 'Norwegian'
          - 'Polish'
          - 'Portuguese'
          - 'Romanian'
          - 'Russian'
          - 'Serbian Latin'
          - 'Slovak'
          - 'Slovenian'
          - 'Spanish'
          - 'Spanish (Mexico)'
          - 'Swedish'
          - 'Thai'
          - 'Turkish'
          - 'Ukrainian'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "choice input accepted: ${{ github.event.inputs.language }}"

            - **Modified by:** [Sensei002](https://github.com/Sensei002)
            - **Build Date:** ${{ github.event.repository.updated_at }}
            - **Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### 📥 Download
            ${{ secrets.SF_SSH_KEY != '' && format('**SourceForge:** [{0}]({1})', env.ISO_NAME, env.SF_DOWNLOAD_URL) || '**GitHub Artifacts:** Check workflow run for download' }}

            ### 💿 Image Details
            | Property | Value |
            |----------|-------|
            | **File** | ${{ env.ISO_NAME }} |
            | **Size** | ${{ env.ISO_SIZE_GB }}GB |
            | **Type** | LTSC (Serviceable) |
            | **Edition** | ${{ env.LTSC_EDITION_NAME }} |
            | **Media** | ${{ env.LTSC_FAMILY }} LTSC ${{ env.LTSC_RELEASE }} |
            | **Index** | ${{ env.LTSC_IMAGE_INDEX }} |
            | **Language** | ${{ github.event.inputs.language }} |

            ### 🔒 Checksums

            **SHA256:**
            ```
            ${{ env.ISO_SHA256 }}
            ```

            **MD5:**
            ```
            ${{ env.ISO_MD5 }}
            ```

            ### ❌ What's Removed
            LTSC media already ships without the consumer app set, so this is what is
            removed on top of it:
            - Microsoft Edge, EdgeWebView, Edge Update
            - OneDrive
            - Xbox apps and Game Bar
            - Teams, Copilot, Chat
            - Telemetry and diagnostics
            - Reserved storage and leftover inbox bloat

            ### ✅ Features
            - ✅ Fully serviceable — LTSC servicing and security updates keep working
            - ✅ No Store, no Copilot, no consumer feature updates by design
            - ✅ Bypasses TPM 2.0, Secure Boot, CPU, RAM requirements
            - ✅ Local account support on OOBE
            - ✅ Disabled telemetry and tracking
            - ✅ Compact installation

            ### 📋 LTSC Editions
            | Family | Index | Edition |
            |--------|-------|---------|
            | Windows 11 LTSC 2024 | 1 | Windows 11 Enterprise LTSC |
            | Windows 11 LTSC 2024 | 2 | Windows 11 IoT Enterprise LTSC |
            | Windows 11 LTSC 2024 | 3 | Windows 11 IoT Enterprise Subscription LTSC |
            | Windows 10 LTSC 2021 | 1 | Windows 10 Enterprise LTSC |
            | Windows 10 LTSC 2021 | 2 | Windows 10 IoT Enterprise LTSC |

            This build: **${{ env.LTSC_EDITION_NAME }}**, image index ${{ env.LTSC_IMAGE_INDEX }}.

            ---

            **⚠️ Disclaimer:** This is an unofficial Windows modification. Use at your own risk. Not affiliated with Microsoft.

            **📜 License:** Educational purposes only. Requires valid Windows licence from Microsoft.
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
            ${{ env.ISO_NAME }}.txt
            tiny11.ps1
          
      - name: Workflow summary
        shell: pwsh
        run: |
          $summary = @"
          # ✅ Tiny11 LTSC Build Completed Successfully

          ## 📦 Build Information
          - **ISO:** $env:ISO_NAME
          - **Size:** $env:ISO_SIZE_GB GB
          - **Release:** ${{ env.RELEASE_TAG }}
          - **Edition:** $env:LTSC_EDITION_NAME
          - **Media:** $env:LTSC_FAMILY LTSC $env:LTSC_RELEASE
          - **Language:** ${{ github.event.inputs.language }}
          - **Image Index:** $env:LTSC_IMAGE_INDEX ($env:LTSC_IMAGE_NAME)

          ## 📥 Download
          ${{ secrets.SF_SSH_KEY != '' && format('🔗 **SourceForge:** [{0}]({1})', env.ISO_NAME, env.SF_DOWNLOAD_URL) || '🔗 **GitHub Artifacts:** Available in workflow run' }}

          ## 🔒 Checksums
          **SHA256:** ``````
          $env:ISO_SHA256
          ``````

          **MD5:** ``````
          $env:ISO_MD5
          ``````

          ## ⏱️ Build Time
          Completed at: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')

          ---
          Built by [Sensei002](https://github.com/Sensei002) | Original by [ntdevlabs](https://github.com/ntdevlabs)
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Capture build error for Discord
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $logFile = Get-ChildItem -Path scripts -Filter "tiny11_*.log" -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime -Descending |
                     Select-Object -First 1
          if ($logFile) {
            $errorLines = Select-String -Path $logFile.FullName -Pattern '\[ERROR\]' |
                          Select-Object -Last 10 |
                          ForEach-Object { $_.Line }
            $errorSummary = if ($errorLines) {
              $errorLines -join "`n"
            } else {
              (Get-Content $logFile.FullName -Tail 5) -join "`n"
            }
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_ERROR_SUMMARY<<EOF"
            Add-Content -Path $env:GITHUB_ENV -Value $errorSummary
            Add-Content -Path $env:GITHUB_ENV -Value "EOF"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_ERROR_SUMMARY=No builder log found — check step outputs above."
          }

      - name: Upload build log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-build-log-${{ github.run_id }}
          path: scripts/tiny11_*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Discord - Build Failed
        if: failure()
        continue-on-error: true
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_START_UNIX
          $duration = "{0}m {1}s" -f [math]::Floor($elapsed / 60), ($elapsed % 60)

          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-failed `
            --data (ConvertTo-Json @{
              version = "$env:LTSC_RELEASE"
              build_type = "LTSC"
              edition = "$env:EDITION_NAME"
              duration = $duration
              error = $env:BUILD_ERROR_SUMMARY
              logs_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              windows_build = "$env:WINDOWS_BUILD_NUMBER"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
        shell: pwsh

# GitHub Actions Workflow for building a Tiny11 Standard-Gaming ISO
# Author: Sensei002 (https://github.com/Sensei002)
# Description: Standard Tiny11 base + the compatible gaming profile
# Repository: https://github.com/Sensei002/tiny11-automated

name: Build and Release Tiny11 Standard-Gaming

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'ISO release label. Defaults to Latest; when no direct URL is supplied, the resolver detects the current x64 ISO from Microsoft.'
        required: false
        default: 'Latest'
      windows_iso_url:
        description: 'Optional. Leave EMPTY to auto-resolve a fresh, signed Windows 11 ISO link from Microsoft at run time - the consumer download page has no static link, so any URL pasted here expires in ~24h. Provide a direct link only to override, e.g. to pin an older 24H2/25H2 build the consumer page no longer serves.'
        required: false
        default: ''
      windows_build:
        description: 'Fallback Windows build number (e.g. 26200.8655) — only used if it cannot be read directly from the ISO'
        required: false
        default: ''
      image_index:
        description: 'Windows image index (1=Home, 4=Education, 6=Pro, 7=Pro N)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '4'
          - '6'
          - '7'
      language:
        description: 'Language (e.g., English, Spanish, French)'
        required: false
        default: 'English'
      skip_cleanup:
        description: 'Skip cleanup (for debugging)'
        required: false
        default: false
        type: boolean
      account_setup:
        description: 'Local account setup. "classic" (default) lets you create your own local account during OOBE; "auto-admin" creates Admin and signs in automatically.'
        type: choice
        required: false
        default: 'classic'
        options:
          - 'auto-admin'
          - 'classic'
      update_to_latest:
        description: 'Install the newest cumulative update Microsoft has published for this build before debloating, so the image is not stuck at the ISO build. "required" fails the build if the update cannot be applied, "best-effort" publishes the image at the ISO build instead, and "off" skips the update entirely. Adds a ~5 GB download and 20-40 minutes.'
        type: choice
        required: false
        default: 'required'
        options:
          - 'required'
          - 'best-effort'
          - 'off'

      # ---------------- Gaming profile ----------------
      #
      # Three inputs only. The per-group switches live in the JSON preset and on the
      # builder as -GamingGroups; this workflow is deliberately a compatibility build,
      # not a second Core-Gaming control panel.
      gaming_preset:
        description: 'Gaming preset. "compatible" (default) keeps WinSxS servicing, WebView2, Bluetooth, the Xbox stack, printing and Defender, and applies only the low-risk latency tweaks. "aggressive" applies the Core-Gaming defaults on the Standard base: security mitigations off, Xbox stack removed, background noise stripped (including Bluetooth services) and printing removed.'
        type: choice
        required: false
        default: 'compatible'
        options:
          - 'compatible'
          - 'aggressive'
      disable_cpu_idle:
        description: 'Gaming: Force CPU to C-State 0 (no idle). OFF by default - it stops turbo on a lot of hardware and raises idle power. Enable only if you measured a wake-latency win. Independent of the preset.'
        type: boolean
        required: false
        default: false
      hags:
        description: 'Gaming: Hardware Accelerated GPU Scheduling. "leave" (default) keeps the Standard default, which is on. "on" and "off" force HwSchMode=2 / 1. Independent of the preset.'
        type: choice
        required: false
        default: 'leave'
        options:
          - 'on'
          - 'off'
          - 'leave'

env:
  ARIA2C_CONNECTIONS: '16'
  ARIA2C_SPLIT: '16'
  POWERSHELL_TELEMETRY_OPTOUT: '1'

jobs:
  build-tiny11-standard-gaming:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Record build start time
        shell: pwsh
        run: |
          $startUnix = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_START_UNIX=$startUnix"

      - name: Generate folder name and build parameters
        shell: pwsh
        run: |
          # ISO filename/tag are finalized later in "Verify tiny11 ISO creation"
          $date = Get-Date -Format 'yyyy-MM-dd'
          $version = "${{ github.event.inputs.windows_version }}"

          # Get edition based on index
          $index = "${{ github.event.inputs.image_index }}"
          $editions = @{
              "1" = "Home"
              "4" = "Education"
              "6" = "Pro"
              "7" = "ProN"
          }
          $edition = $editions[$index]

          $language = "${{ github.event.inputs.language }}" -replace '[^a-zA-Z]', ''

          # New structure: Tiny11StandardGaming-EDITION-VERSION for folders
          $folderName = "Tiny11StandardGaming-$edition-$version"

          Write-Output "Generated folder name: $folderName"

          Add-Content -Path $env:GITHUB_ENV -Value "FOLDER_NAME=$folderName"
          Add-Content -Path $env:GITHUB_ENV -Value "EDITION_NAME=$edition"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_DATE=$date"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_LANGUAGE=$language"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Discord - Build Started
        continue-on-error: true
        run: |
          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-started `
            --data (ConvertTo-Json @{
              version = "${{ inputs.windows_version }}"
              build_type = "Standard-Gaming"
              edition = "$env:EDITION_NAME"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILDS }}
        shell: pwsh

      - name: System information
        shell: pwsh
        run: |
          Write-Output "=== System Information ==="
          Write-Output "OS: $(Get-CimInstance Win32_OperatingSystem | Select-Object -ExpandProperty Caption)"
          Write-Output "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Output "Architecture: $env:PROCESSOR_ARCHITECTURE"

          $disk = Get-PSDrive C
          $freeGB = [math]::Round($disk.Free / 1GB, 2)
          $totalGB = [math]::Round($disk.Used / 1GB + $disk.Free / 1GB, 2)
          Write-Output "Disk C: ${freeGB}GB free / ${totalGB}GB total"

          if ($freeGB -lt 25) {
            Write-Error "Insufficient disk space. At least 25GB required, found ${freeGB}GB"
            exit 1
          }

      - name: Install aria2c
        shell: pwsh
        run: |
          Write-Output "Installing aria2c for faster downloads..."
          choco install aria2 -y --no-progress
          aria2c --version

      - name: Resolve Windows 11 ISO download URL
        shell: pwsh
        run: |
          # Microsoft's consumer download page has no static ISO link: it mints a
          # short-lived signed dbazure URL on demand, so a URL pasted into the input
          # expires within ~24h (which is why a hardcoded default goes stale). When
          # the input is empty we mint a fresh one here, driving the same request
          # sequence Fido (pbatard/Fido) uses, via curl.exe - no Playwright needed.
          # Providing a URL still overrides this, e.g. to pin an older build.
          Set-ExecutionPolicy Bypass -Scope Process -Force

          $override = "${{ github.event.inputs.windows_iso_url }}"
          if (-not [string]::IsNullOrWhiteSpace($override)) {
            Write-Output "Using the ISO URL supplied in the input (override)."
            $isoUrl = $override.Trim()
          } else {
            $version  = "${{ github.event.inputs.windows_version }}"
            $language = "${{ github.event.inputs.language }}"

            # Microsoft spells languages as the download page shows them.
            if ([string]::IsNullOrWhiteSpace($language) -or $language -match '(?i)^en') {
              $msLanguage = 'English (United States)'
            } else {
              $msLanguage = $language
            }
            # The resolver detects the current x64 multi-edition ISO from Microsoft's live page.

            Write-Output "No URL supplied - resolving the current Windows 11 consumer ISO from Microsoft..."
            Write-Output "  version label : $version"
            Write-Output "  language      : $msLanguage"
            Write-Output "  productEdition: $productEditionId"

            try {
              $iso = & .\scripts\resolve-windows-iso.ps1 -Language $msLanguage
            } catch {
              Write-Error "Failed to resolve the Windows 11 ISO URL: $($_.Exception.Message)"
              exit 1
            }
            if (-not $iso -or [string]::IsNullOrWhiteSpace($iso.Url)) {
              Write-Error "resolve-windows-iso.ps1 returned no download URL."
              exit 1
            }
            $isoUrl = $iso.Url
            Write-Output "Resolved ISO: $($iso.FileName)"
          }

          if ([string]::IsNullOrWhiteSpace($isoUrl)) {
            Write-Error "No Windows 11 ISO URL could be determined."
            exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_ISO_URL=$isoUrl"
          Write-Output "ISO download URL ready (saved to WINDOWS_ISO_URL)."

      - name: Download Windows 11 ISO
        shell: pwsh
        run: |
          $url = "$env:WINDOWS_ISO_URL"
          $output = "Win11_Source.iso"

          Write-Output "Downloading Windows 11 ISO from Microsoft servers..."
          Write-Output "URL: $($url.Substring(0, 100))..."

          $startTime = Get-Date

          aria2c `
            --console-log-level=info `
            --summary-interval=30 `
            --max-connection-per-server=${{ env.ARIA2C_CONNECTIONS }} `
            --split=${{ env.ARIA2C_SPLIT }} `
            --min-split-size=5M `
            --max-tries=5 `
            --retry-wait=3 `
            --timeout=60 `
            --connect-timeout=30 `
            --continue=true `
            --allow-overwrite=true `
            --auto-file-renaming=false `
            --file-allocation=none `
            --check-integrity=true `
            --out=$output `
            "$url"

          $downloadTime = (Get-Date) - $startTime

          if (-not (Test-Path $output)) {
            Write-Error "Download failed - ISO file not found"
            exit 1
          }

          $sizeGB = [math]::Round((Get-Item $output).Length / 1GB, 2)
          Write-Output "Download complete: ${sizeGB}GB in $($downloadTime.TotalMinutes.ToString('F2')) minutes"

      - name: Mount Windows ISO
        shell: pwsh
        run: |
          $isoPath = Join-Path $PWD "Win11_Source.iso"
          Write-Output "Mounting ISO: $isoPath"

          $mount = Mount-DiskImage -ImagePath $isoPath -PassThru -StorageType ISO
          Start-Sleep -Seconds 3

          $driveLetter = ($mount | Get-Volume).DriveLetter

          if (-not $driveLetter) {
            Write-Error "Failed to mount ISO or retrieve drive letter"
            exit 1
          }

          Write-Output "ISO mounted successfully at drive: ${driveLetter}:"

          # Verify critical files exist
          $requiredFiles = @(
            "${driveLetter}:\sources\boot.wim",
            "${driveLetter}:\sources\install.wim",
            "${driveLetter}:\sources\install.esd"
          )

          $foundFiles = $requiredFiles | Where-Object { Test-Path $_ }

          if ($foundFiles.Count -eq 0) {
            Write-Error "No install.wim or install.esd found on mounted ISO"
            exit 1
          }

          Write-Output "Found: $($foundFiles -join ', ')"

          # Persist drive letter for next steps
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_DRIVE=$driveLetter"

      - name: Prepare autounattend.xml
        shell: pwsh
        run: |
          if (Test-Path "autounattend.xml") {
            Write-Output "Found local autounattend.xml"
            Copy-Item "autounattend.xml" "scripts\autounattend.xml" -Force
            Write-Output "Copied to scripts directory"
          } else {
            Write-Warning "autounattend.xml not found in root!"
          }

      - name: Verify headless script
        shell: pwsh
        run: |
          $scriptPath = ".\scripts\tiny11maker-headless.ps1"

          if (-not (Test-Path $scriptPath)) {
            Write-Error "Headless script not found at $scriptPath"
            Write-Output "Available files:"
            Get-ChildItem -Path . -Recurse -Filter "*.ps1" | ForEach-Object { Write-Output $_.FullName }
            exit 1
          }

          Write-Output "Headless script found: $scriptPath"

      - name: Run tiny11maker (headless mode)
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force

          $params = @{
            ISO = $env:ISO_DRIVE
            INDEX = [int]"${{ github.event.inputs.image_index }}"
          }

          if ("${{ github.event.inputs.skip_cleanup }}" -eq "true") {
            $params.SkipCleanup = $true
            Write-Output "Cleanup will be skipped (debugging mode)"
          }

          # Default on. An automation dispatch never sends this key, so compare
          # against the literal "false" rather than testing for "true".
          # One tri-state input instead of two booleans, because GitHub allows at
          # most 25 workflow_dispatch inputs and the Core-Gaming workflow was
          # already at the cap. "required" is the default, so a published image
          # is always the current build.
          $updateMode = "${{ github.event.inputs.update_to_latest }}"
          if ([string]::IsNullOrWhiteSpace($updateMode)) { $updateMode = 'required' }
          if ($updateMode -eq 'off') {
            Write-Output "Skipping the cumulative update (update_to_latest = off)"
          } else {
            $params.UpdateToLatest = $true
            Write-Output "Will install the newest cumulative update before debloating (mode: $updateMode)"
            if ($updateMode -eq 'required') {
              $params.RequireLatestUpdate = $true
              Write-Output "The build fails if the update cannot be applied"
            }
          }

          # Only fall back to the default when nothing was supplied, so the
          # builder's ValidateSet never receives an empty string.
          $accountSetup = "${{ github.event.inputs.account_setup }}"
          if ([string]::IsNullOrWhiteSpace($accountSetup)) { $accountSetup = 'classic' }
          Write-Output "Account setup: $accountSetup"

          # The Standard builder takes the gaming layer as opt-in switches. The
          # workflow always enables it, selects the preset file, and leaves the
          # per-group defaults to that file. disable_cpu_idle is the one exception:
          # it has a documented hardware downside, so it is always passed
          # explicitly rather than left to the preset.
          $gamingPreset = "${{ github.event.inputs.gaming_preset }}"
          if ([string]::IsNullOrWhiteSpace($gamingPreset)) { $gamingPreset = 'compatible' }
          $gamingProfileFile = Join-Path $PWD 'config\gaming_profile_compatible.json'
          if ($gamingPreset -eq 'aggressive') {
            $gamingProfileFile = Join-Path $PWD 'config\gaming_profile.json'
          }

          $disableCpuIdle = ("${{ github.event.inputs.disable_cpu_idle }}" -eq 'true')
          $gamingGroups = @{ disable_cpu_idle = $disableCpuIdle }

          $hags = "${{ github.event.inputs.hags }}"
          if ([string]::IsNullOrWhiteSpace($hags)) { $hags = 'leave' }

          $params.GamingProfile = $true
          $params.GamingProfileFile = $gamingProfileFile
          $params.GamingGroups = $gamingGroups
          $params.HagsMode = $hags
          # Compatibility is the reason this workflow exists: the profile may
          # decide about the Xbox stack, but the base image must not remove the
          # runtime or the packages before the profile runs.
          $params.PreserveWebView2 = $true
          $params.PreserveXbox = $true

          Write-Output "=== Starting Tiny11 Standard-Gaming Builder ==="
          Write-Output "ISO Drive: $($params.ISO)"
          Write-Output "Image Index: $($params.INDEX)"
          Write-Output "Account setup: $accountSetup"
          Write-Output "Gaming preset: $gamingPreset"
          Write-Output "Gaming profile: $gamingProfileFile"
          Write-Output "HAGS: $hags"
          Write-Output "  [$(if ($disableCpuIdle) { 'ON ' } else { 'off' })] disable_cpu_idle (C-State 0)"
          Write-Output "Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

          $startTime = Get-Date

          .\scripts\tiny11maker-headless.ps1 @params -AccountSetup $accountSetup

          $buildTime = (Get-Date) - $startTime
          Write-Output "Build completed in $($buildTime.TotalMinutes.ToString('F2')) minutes"

      - name: Verify Standard-Gaming layer ran
        shell: pwsh
        run: |
          $gamingInfoPath = ".\scripts\tiny11-standard-gaming-buildinfo.json"
          if (-not (Test-Path $gamingInfoPath)) {
            Write-Error "Standard-Gaming build info not found at $gamingInfoPath - the gaming layer did not run. Refusing to publish a plain Standard ISO under a Standard-Gaming name."
            exit 1
          }

          try {
            $gamingInfo = Get-Content -Path $gamingInfoPath -Raw | ConvertFrom-Json
          } catch {
            Write-Error "Could not parse $gamingInfoPath : $_"
            exit 1
          }

          Write-Output "Gaming profile: $($gamingInfo.gaming_profile) (HAGS: $($gamingInfo.hags_mode))"
          Write-Output "Registry values applied: $($gamingInfo.counts.registry)"
          Write-Output "Services disabled:       $($gamingInfo.counts.services)"
          Write-Output "AppX packages removed:   $($gamingInfo.counts.appx)"
          Write-Output "System packages removed: $($gamingInfo.counts.packages)"
          Write-Output "Features removed:        $($gamingInfo.counts.features)"

      - name: Verify tiny11 ISO creation
        shell: pwsh
        run: |
          $tempIso = ".\scripts\tiny11.iso"

          # Check if ISO was created
          if (-not (Test-Path $tempIso)) {
            Write-Error "$tempIso was not created!"
            Write-Output "Contents of current directory:"
            Get-ChildItem -Path . | Format-Table Name, Length, LastWriteTime
            exit 1
          }

          # Real build number: from ISO metadata, else workflow_dispatch fallback
          $buildInfoPath = ".\scripts\tiny11-buildinfo.json"
          $buildNumber = ""

          if (Test-Path $buildInfoPath) {
            try {
              $buildInfo = Get-Content -Path $buildInfoPath -Raw | ConvertFrom-Json
              $buildNumber = $buildInfo.windows_build
              Write-Output "Build number from ISO metadata: $buildNumber"
            } catch {
              Write-Output "Could not parse $buildInfoPath : $_"
            }
          }

          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
            $buildNumber = "${{ github.event.inputs.windows_build }}"
            if (-not [string]::IsNullOrWhiteSpace($buildNumber)) {
              Write-Output "Build number from workflow fallback input: $buildNumber"
            }
          }

          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
            Write-Error "Unable to determine Windows build number: ISO metadata extraction failed and no windows_build fallback input was provided. Refusing to publish an ISO without a verifiable build number."
            exit 1
          }

          $version = "${{ github.event.inputs.windows_version }}"
          $language = "$env:BUILD_LANGUAGE"
          $edition = "$env:EDITION_NAME"
          $date = "$env:BUILD_DATE"

          $isoName = "Tiny11StandardGaming-$version-$buildNumber-$language-$edition-$date.iso"

          # Build-number-first tag, suffixed to avoid collisions across editions
          $baseTag = "$buildNumber-stdgaming-$($edition.ToLower())"

          Write-Output "Generated ISO name: $isoName"
          Write-Output "Generated release tag: $baseTag"

          Add-Content -Path $env:GITHUB_ENV -Value "ISO_FILENAME=$isoName"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$baseTag"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_BUILD_NUMBER=$buildNumber"

          # Rename to proper filename
          Move-Item -Path $tempIso -Destination $isoName -Force
          Write-Output "ISO renamed to: $isoName"

          $sizeGB = [math]::Round((Get-Item $isoName).Length / 1GB, 2)
          Write-Output "$isoName created successfully: ${sizeGB}GB"

          # Generate checksums
          Write-Output "Generating checksums..."
          $sha256 = (Get-FileHash -Path $isoName -Algorithm SHA256).Hash
          $md5 = (Get-FileHash -Path $isoName -Algorithm MD5).Hash

          # Save checksums to files
          "$sha256  $isoName" | Out-File -FilePath "$isoName.sha256" -Encoding ASCII
          "$md5  $isoName" | Out-File -FilePath "$isoName.md5" -Encoding ASCII

          # Create verification file with all info
          $verificationInfo = @"
          Tiny11 ISO Verification
          ========================
          File: $isoName
          Folder: $env:FOLDER_NAME
          Windows Build: $buildNumber
          Size: ${sizeGB}GB
          Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          Image Index: ${{ github.event.inputs.image_index }}
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          SHA256: $sha256
          MD5: $md5

          To verify:
            certutil -hashfile $isoName SHA256
            certutil -hashfile $isoName MD5
          "@

          $verificationInfo | Out-File -FilePath "$isoName.txt" -Encoding UTF8

          # Persist values for later steps
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_NAME=$isoName"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_SIZE_GB=$sizeGB"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_SHA256=$sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ISO_MD5=$md5"

      - name: Discord - Build Completed
        if: success()
        continue-on-error: true
        run: |
          $isoSize = if ($env:ISO_SIZE_GB) {
            "$env:ISO_SIZE_GB GB"
          } else {
            $isoPath = Get-ChildItem -Path . -Filter "*.iso" -Recurse | Select-Object -First 1
            if ($isoPath) { "{0:N2} GB" -f ($isoPath.Length / 1GB) } else { "Unknown" }
          }

          # Compute real elapsed wall-clock duration from the recorded start time
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_START_UNIX
          $duration = "{0}m {1}s" -f [math]::Floor($elapsed / 60), ($elapsed % 60)

          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-completed `
            --data (ConvertTo-Json @{
              version = "${{ inputs.windows_version }}"
              build_type = "Standard-Gaming"
              edition = "$env:EDITION_NAME"
              duration = $duration
              iso_size = $isoSize
              download_url = "https://sourceforge.net/projects/tiny11-automated/"
              windows_build = "$env:WINDOWS_BUILD_NUMBER"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILDS }}
        shell: pwsh

      - name: Cleanup before upload
        shell: pwsh
        run: |
          Write-Output "Cleaning up to free disk space..."

          # Unmount ISO
          $isoPath = Join-Path $PWD "Win11_Source.iso"
          if (Test-Path $isoPath) {
            Get-DiskImage -ImagePath $isoPath | Dismount-DiskImage -ErrorAction SilentlyContinue
            Write-Output "ISO unmounted"
          }

          # Remove source ISO
          Remove-Item "Win11_Source.iso" -Force -ErrorAction SilentlyContinue

          # Remove build logs if they're large
          Get-ChildItem -Path . -Filter "*.log" | Where-Object { $_.Length -gt 10MB } | Remove-Item -Force

          $disk = Get-PSDrive C
          $freeGB = [math]::Round($disk.Free / 1GB, 2)
          Write-Output "Available space after cleanup: ${freeGB}GB"

      - name: Check upload configuration
        id: check-upload
        shell: pwsh
        env:
          SF_KEY: ${{ secrets.SF_SSH_KEY }}
          ENABLE_UPLOAD: ${{ vars.ENABLE_SOURCEFORGE_UPLOAD }}
        run: |
          if ($env:ENABLE_UPLOAD -eq 'true' -or -not [string]::IsNullOrWhiteSpace($env:SF_KEY)) {
            Write-Output "Upload condition met."
            "DO_UPLOAD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          } else {
            Write-Output "Upload condition NOT met. Fallback to artifacts."
            "DO_UPLOAD=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          }

      - name: Validate SourceForge credentials
        if: env.DO_UPLOAD == 'true'
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SF_SSH_KEY)) {
            Write-Error "SF_SSH_KEY secret is not configured"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:SF_USERNAME)) {
            Write-Error "SF_USERNAME secret is not configured"
            exit 1
          }

          Write-Output "Credentials validated successfully"

      - name: Setup SSH for SourceForge
        if: env.DO_UPLOAD == 'true'
        shell: pwsh
        env:
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          # 1. Validation
          if ([string]::IsNullOrWhiteSpace($env:SF_SSH_KEY)) { Write-Error "Secret SF_SSH_KEY is missing"; exit 1 }

          # Fallback for Project Name
          if ([string]::IsNullOrWhiteSpace($env:SF_PROJECT)) {
            $env:SF_PROJECT = "${{ github.event.repository.name }}"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "SF_PROJECT=$env:SF_PROJECT"

          # 2. Create SSH Directory
          $sshDir = "$env:USERPROFILE\.ssh"
          if (!(Test-Path $sshDir)) { New-Item -ItemType Directory -Force -Path $sshDir | Out-Null }

          $keyPath = "$sshDir\sf_key"

          # 3. Write Private Key (BASE64 DECODE FIX)
          # We decode the base64 secret back into a raw file.
          # This creates a perfect file byte-for-byte, fixing the "Invalid Format" error.
          try {
            $keyBytes = [System.Convert]::FromBase64String($env:SF_SSH_KEY)
            [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          } catch {
            Write-Error "Failed to decode SF_SSH_KEY. Did you Base64 encode it in Termux first?"
            exit 1
          }

          # 4. Fix Permissions (Windows ACLs)
          # OpenSSH on Windows refuses keys that are too "open".
          icacls $keyPath /c /t /inheritance:d
          icacls $keyPath /c /t /grant "${env:USERNAME}:F"
          icacls $keyPath /c /t /remove Administrator "Authenticated Users" BUILTIN\Administrators BUILTIN\Users

          # 5. Add Known Host
          ssh-keyscan -t rsa,ecdsa,ed25519 frs.sourceforge.net | Out-File -FilePath "$sshDir\known_hosts" -Encoding ascii

          Write-Output "SSH configuration complete."

      - name: Upload to SourceForge (Recursive Method)
        if: env.DO_UPLOAD == 'true'
        shell: pwsh
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT || github.event.repository.name }}
          ISO_NAME: ${{ env.ISO_NAME }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $keyPath = "$env:USERPROFILE\.ssh\sf_key"

          # 1. Prepare a local folder
          # We create a folder locally named after the edition and version (e.g., "Tiny11StandardGaming-HOME-25H2")
          Write-Output "Organizing files into folder: $env:FOLDER_NAME"
          New-Item -ItemType Directory -Force -Path $env:FOLDER_NAME | Out-Null

          # 2. Copy the ISO into this folder
          # Only the image goes to SourceForge, so a release folder reads as a plain
          # list of ISOs. The .sha256 / .md5 / .txt stay as GitHub release assets and
          # inside the workflow artifact, where they are still published and still
          # carry the Folder line the backfill workflow reads.
          # Copy-Item, not Move-Item, so the file survives for the GitHub Release step.
          Copy-Item $env:ISO_NAME $env:FOLDER_NAME

          # Copy SourceForge README
          if (Test-Path "SOURCEFORGE_README.md") {
            Copy-Item "SOURCEFORGE_README.md" $env:FOLDER_NAME
            Write-Output "Copied SOURCEFORGE_README.md to folder"
          }

          # 3. Upload the WHOLE folder
          # The '-r' flag tells SCP to copy the folder.
          # SCP will automatically create the directory on SourceForge if it doesn't exist.
          $remoteRoot = "$env:SF_USERNAME@frs.sourceforge.net:/home/frs/project/$env:SF_PROJECT/"

          # Keepalives, because a stalled connection otherwise hangs until the job
          # timeout. An earlier run sat here for 17 minutes having written zero
          # bytes and would have burned all 360. ServerAliveInterval=15 with
          # CountMax=4 gives up on a dead peer in about a minute, and one retry
          # covers the case where it was the connection rather than the file.
          $scpOptions = @(
            '-o', 'StrictHostKeyChecking=no',
            '-o', 'ConnectTimeout=30',
            '-o', 'ServerAliveInterval=15',
            '-o', 'ServerAliveCountMax=4'
          )

          $scpExit = 1
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Output "Uploading folder (attempt $attempt of 2)..."
            scp -i $keyPath -r @scpOptions $env:FOLDER_NAME $remoteRoot
            $scpExit = $LASTEXITCODE
            if ($scpExit -eq 0) { break }
            Write-Output "SCP exited with $scpExit"
            if ($attempt -lt 2) { Start-Sleep -Seconds 15 }
          }

          if ($scpExit -ne 0) {
            Write-Error "SCP Upload failed after 2 attempt(s)"
            exit 1
          }
          Write-Output "Upload success!"

          # 4. Set Download URL
          $downloadUrl = "https://sourceforge.net/projects/$env:SF_PROJECT/files/$env:FOLDER_NAME/$env:ISO_NAME/download"
          Add-Content -Path $env:GITHUB_ENV -Value "SF_DOWNLOAD_URL=$downloadUrl"

      - name: Cleanup SSH credentials
        if: always()
        shell: pwsh
        run: |
          $keyPath = "$env:USERPROFILE\.ssh\sf_key"
          if (Test-Path $keyPath) {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
            Write-Output "SSH key cleaned up"
          }

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
            ${{ env.ISO_NAME }}.txt
          retention-days: 7
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Tiny11 Standard-Gaming Windows 11 ${{ github.event.inputs.windows_version }} - ${{ env.RELEASE_TAG }}
          body: |
            ## 🧩 Tiny11 Standard-Gaming Windows 11 ${{ github.event.inputs.windows_version }}

            **Serviceable Standard base plus the compatibility-first gaming profile.**

            ### 📦 Build Information
            - **Built with:** [tiny11builder](https://github.com/ntdevlabs/tiny11builder) by ntdevlabs
            - **Modified by:** [Sensei002](https://github.com/Sensei002)
            - **Build Date:** ${{ github.event.repository.updated_at }}
            - **Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### 📥 Download
            ${{ secrets.SF_SSH_KEY != '' && format('**SourceForge:** [{0}]({1})', env.ISO_NAME, env.SF_DOWNLOAD_URL) || '**GitHub Artifacts:** Check workflow run for download' }}

            ### 💿 Image Details
            | Property | Value |
            |----------|-------|
            | **File** | ${{ env.ISO_NAME }} |
            | **Size** | ${{ env.ISO_SIZE_GB }}GB |
            | **Type** | Standard-Gaming (serviceable + gaming layer) |
            | **Preset** | ${{ github.event.inputs.gaming_preset }} |
            | **HAGS** | ${{ github.event.inputs.hags }} |
            | **Base** | Windows 11 ${{ github.event.inputs.windows_version }} |
            | **Index** | ${{ github.event.inputs.image_index }} |
            | **Language** | ${{ github.event.inputs.language }} |
            | **WinRE** | Preserved |

            ### 🔒 Checksums

            **SHA256:**
            ```
            ${{ env.ISO_SHA256 }}
            ```

            **MD5:**
            ```
            ${{ env.ISO_MD5 }}
            ```

            ### ❌ What's Removed
            - Microsoft Edge browser, Edge Update and OneDrive (the **WebView2 runtime is kept**)
            - Teams, Copilot, Chat
            - Sponsored apps and suggestions
            - Telemetry and diagnostics
            - Bloatware (Clipchamp, News, Weather, etc.)

            The **compatible** preset removes no AppX packages, system packages or optional
            features of its own. The **aggressive** preset additionally removes the Xbox /
            Gaming Services stack and printing, and disables security mitigations.

            ### ✅ Features
            - ✅ Fully serviceable - can add languages, updates and features
            - ✅ WebView2 runtime kept - Elgato Wave Link and game launchers work
            - ✅ Bluetooth kept
            - ✅ Xbox stack, printing and Defender kept with the compatible preset
            - ✅ Bypasses TPM 2.0, Secure Boot, CPU, RAM requirements
            - ✅ Local account support on OOBE
            - ✅ Disabled telemetry and tracking
            - ✅ Gaming power scheme and low-risk latency tweaks

            ### ⚡ Applied by the gaming layer
            - AtlasOS-style power scheme, Fullscreen Optimizations off, MPO off
            - Input / network latency tweaks, instant window response, Game Mode off
            - **HAGS:** ${{ github.event.inputs.hags }} (the Standard base defaults to on)
            - **CPU idle disabled:** ${{ github.event.inputs.disable_cpu_idle }}

            ### 🔁 Reverting
            Two files ship inside the image:
            - `C:\Windows\Tiny11Gaming\Undo-GamingTweaks.ps1` - restores the reversible settings
            - `C:\Windows\Tiny11Gaming\GAMING_PROFILE.md` - the exact list of what was changed

            ### 📋 Windows Editions
            | Index | Edition |
            |-------|---------|
            | 1 | Home |
            | 4 | Education |
            | 6 | Pro |
            | 7 | Pro N |

            ---

            **⚠️ Disclaimer:** This is an unofficial Windows 11 modification. Use at your own risk. Not affiliated with Microsoft.

            **📜 License:** Educational purposes only. Requires valid Windows license from Microsoft.
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
            ${{ env.ISO_NAME }}.txt
            tiny11.ps1

      - name: Workflow summary
        shell: pwsh
        run: |
          $summary = @"
          # 🧩 Tiny11 Standard-Gaming Build Completed Successfully

          ## 📦 Build Information
          - **ISO:** $env:ISO_NAME
          - **Size:** $env:ISO_SIZE_GB GB
          - **Release:** ${{ env.RELEASE_TAG }}
          - **Version:** ${{ github.event.inputs.windows_version }}
          - **Type:** Standard-Gaming (serviceable + gaming layer)
          - **Preset:** ${{ github.event.inputs.gaming_preset }}
          - **HAGS:** ${{ github.event.inputs.hags }}
          - **Language:** ${{ github.event.inputs.language }}
          - **Image Index:** ${{ github.event.inputs.image_index }}

          ## 📥 Download
          ${{ secrets.SF_SSH_KEY != '' && format('🔗 **SourceForge:** [{0}]({1})', env.ISO_NAME, env.SF_DOWNLOAD_URL) || '🔗 **GitHub Artifacts:** Available in workflow run' }}

          ## 🔒 Checksums
          **SHA256:** ``````
          $env:ISO_SHA256
          ``````

          **MD5:** ``````
          $env:ISO_MD5
          ``````

          ## ⏱️ Build Time
          Completed at: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')

          ---
          Built by [Sensei002](https://github.com/Sensei002) | Original by [ntdevlabs](https://github.com/ntdevlabs)
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Capture build error for Discord
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $logFile = Get-ChildItem -Path scripts -Filter "tiny11_*.log" -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime -Descending |
                     Select-Object -First 1
          if ($logFile) {
            $errorLines = Select-String -Path $logFile.FullName -Pattern '\[ERROR\]' |
                          Select-Object -Last 10 |
                          ForEach-Object { $_.Line }
            $errorSummary = if ($errorLines) {
              $errorLines -join "`n"
            } else {
              (Get-Content $logFile.FullName -Tail 5) -join "`n"
            }
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_ERROR_SUMMARY<<EOF"
            Add-Content -Path $env:GITHUB_ENV -Value $errorSummary
            Add-Content -Path $env:GITHUB_ENV -Value "EOF"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "BUILD_ERROR_SUMMARY=No builder log found — check step outputs above."
          }

      - name: Upload build log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-standard-gaming-build-log-${{ github.run_id }}
          path: scripts/tiny11_*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Discord - Build Failed
        if: failure()
        continue-on-error: true
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_START_UNIX
          $duration = "{0}m {1}s" -f [math]::Floor($elapsed / 60), ($elapsed % 60)

          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type build-failed `
            --data (ConvertTo-Json @{
              version = "${{ inputs.windows_version }}"
              build_type = "Standard-Gaming"
              edition = "$env:EDITION_NAME"
              duration = $duration
              error = $env:BUILD_ERROR_SUMMARY
              logs_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              windows_build = "$env:WINDOWS_BUILD_NUMBER"
            } -Compress)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
        shell: pwsh

# .github/workflows/watch-updates.yml
# Watches the Microsoft Update Catalog for newly published cumulative updates and
# posts a Discord ping so a human can decide to re-run the build workflows.
# Author: Sensei002 (https://github.com/Sensei002)
#
# It deliberately does NOT trigger any build. The build workflows already slipstream
# the newest cumulative update, so the only thing worth doing when a new update lands
# is re-running them - and that stays a manual decision. (The version-matrix-builder
# handles brand-new Windows *releases*; this handles incremental cumulative updates
# to versions already being built.)

name: Watch for New Windows Updates

on:
  schedule:
    # Weekly, Sunday 03:00 UTC - after the version-matrix-builder (00:00 UTC) and
    # often enough to catch the monthly Patch-Tuesday cumulative update.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write   # commit the tracking file

jobs:
  watch-updates:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for new cumulative updates
        id: check
        shell: pwsh
        run: |
          .\scripts\check-latest-updates.ps1 `
            -TrackingFile tracked_updates.json `
            -GitHubOutput $env:GITHUB_OUTPUT

      - name: Discord - new update available
        if: steps.check.outputs.has_new == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          NEW_UPDATES: ${{ steps.check.outputs.new_updates }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
        run: |
          python -m pip install --quiet requests
          python scripts/discord_notify.py `
            --webhook "$env:DISCORD_WEBHOOK" `
            --type update-available `
            --data "$env:NEW_UPDATES"

      - name: Commit updated tracking file
        if: always() && !cancelled()
        shell: pwsh
        run: |
          git config user.name "Update Watcher"
          git config user.email "Sensei002@users.noreply.github.com"
          git add tracked_updates.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No change to tracked_updates.json."
            exit 0
          }
          git commit -m "chore: record latest cumulative updates"
          git push origin main

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.check.outputs.has_new }}" -eq 'true') {
            Write-Output "::notice title=New update::A newer cumulative update was detected - Discord notified. Re-run the build workflow(s) to publish a fresh ISO."
          } else {
            Write-Output "No new cumulative updates since the last run."
          }
